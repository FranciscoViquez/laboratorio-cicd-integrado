name: 02 - Pipeline de Integracion Continua (CI)

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Ejecutar Flake8
        run: flake8 .

      - name: Ejecutar PyTest
        run: pytest -v

      - name: Compilar Docker
        run: docker build -t app-muestra:${{ github.sha }} .